# Security audit 2026-11 WS3 — cargo-fuzz targets for the sbo parsers.
#
# Standalone workspace on purpose: the root Cargo.toml's member list drives the
# mingo-side Dockerfile's dependency-caching stage, and libfuzzer-sys needs
# nightly. Build and run only through `cargo +nightly fuzz` (see README.md /
# `make fuzz-smoke`). `sbo-core` is built without `storage` so the fuzz build
# never touches rocksdb.
[package]
name = "sbo-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
chrono = "0.4"
sbo-core = { path = "../crates/sbo-core", default-features = false }
sbo-crypto = { path = "../crates/sbo-crypto" }
sbo-types = { path = "../crates/sbo-types" }

[workspace]

# Same vendored dnssec-prover as the root workspace (sbo-core imports
# verify_rr_stream_with_anchors, which only the vendored copy has).
[patch.crates-io]
dnssec-prover = { path = "../vendor/dnssec-prover" }

[profile.release]
debug = 1

[[bin]]
name = "gen_seeds"
path = "src/bin/gen_seeds.rs"
test = false
doc = false
bench = false

[[bin]]
name = "wire_parse"
path = "fuzz_targets/wire_parse.rs"
test = false
doc = false
bench = false

