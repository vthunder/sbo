# Standing supply-chain gate (security audit 2026-11, WS7). Three checks, all
# runnable locally with the same tools:
#   cargo audit        RUSTSEC vulnerabilities; ignores in .cargo/audit.toml
#   cargo deny check   advisories + licenses + sources + duplicate bans; deny.toml
#   gitleaks           secrets over the FULL history; allowlist in .gitleaks.toml
# Every ignore carries a reason and a review date. Actions are pinned by
# commit SHA (release in the comment). Red on main until remediation R7-1
# (`cargo update`) lands: see docs/security-audit-2026-11-ws7-supply-chain.md.

name: supply-chain

on:
  push:
    branches: [main]
  schedule:
    # Weekly, so a new advisory against an unchanged tree still surfaces.
    - cron: "23 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@cfcaf53ba4c621917ec7f78a66bff7a8848ddad4 # 1.93.1
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-audit
      - run: cargo audit

  cargo-deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          rust-version: "1.93.1"

  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history: the scan covers every commit
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_SUMMARY: "false"
