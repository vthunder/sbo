# Security audit 2026-11, WS3: build every cargo-fuzz target on nightly and
# run each for a short budget. A crash or timeout fails the job; the crash
# input is uploaded. Weekly (plus on changes under fuzz/ and on demand) — the
# long runs stay on the dev box (`make fuzz-smoke`, fuzz/README.md).
#
# Third-party actions are pinned by commit SHA with the release in a trailing
# comment (same pins as test.yml).

name: fuzz-smoke

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  push:
    branches: [main]
    paths:
      - "fuzz/**"
      - "scripts/fuzz-smoke.sh"
      - ".github/workflows/fuzz-smoke.yml"
  pull_request:
    paths:
      - "fuzz/**"
      - "scripts/fuzz-smoke.sh"
      - ".github/workflows/fuzz-smoke.yml"
  workflow_dispatch:
    inputs:
      secs:
        description: "Seconds per target"
        default: "30"

concurrency:
  group: fuzz-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@48b64ba94bc1a6fe819fd9afc0799a7647efdc65 # 1.93.0
        with:
          toolchain: nightly

      - name: Native build deps (protobuf for avail-rust via sbo-core)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang libclang-dev cmake protobuf-compiler

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz -> target

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Smoke every target
        env:
          FUZZ_SECS: ${{ github.event.inputs.secs || '30' }}
        run: scripts/fuzz-smoke.sh

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore
