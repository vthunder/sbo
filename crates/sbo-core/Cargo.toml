[package]
name = "sbo-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "SBO core library - wire format, crypto, policy, state"

[dependencies]
ed25519-dalek.workspace = true
sha2.workspace = true
rand.workspace = true
hex.workspace = true
rocksdb = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
sbo-types = { path = "../sbo-types", features = ["serde"] }
sbo-crypto = { path = "../sbo-crypto" }
base64 = "0.22"
dirs = "5"
hickory-resolver = "0.24"
browserid-core.workspace = true
dnssec-prover = "0.6.8"
# Test-only synthetic DNSSEC zone signer (ECDSA P-256), feature `dnssec-fixtures`.
ring = { version = "0.17", optional = true }

[dev-dependencies]
# Enable the offline DNSSEC fixture builder for this crate's own tests.
sbo-core = { path = ".", features = ["dnssec-fixtures"] }
tokio = { workspace = true, features = ["rt", "macros"] }
tempfile = "3"
chrono = "0.4.45"
proptest = "1"

[features]
# `storage` (default-on) is the RocksDB-backed state DB + indexer. Pure consumers
# that only build/verify objects (e.g. mingo-idp's server-side signer) turn it
# off with `default-features = false` to avoid the rocksdb → bindgen → libclang
# build chain.
default = ["storage"]
storage = ["dep:rocksdb"]
bls = ["sbo-crypto/bls"]
# Offline DNSSEC fixtures (`crate::dnssec_fixture`): synthetic RFC 9102 chains
# signed with a test P-256 zone key. Test-only; never enable in a release build.
dnssec-fixtures = ["dep:ring"]
